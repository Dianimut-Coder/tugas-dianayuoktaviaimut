<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form login dianimut</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-login" style="background-image: url('background.png');">
    <form action="#" method="POST">
        <fieldset>
        <h1 style="color: white;">LOGIN</h1>
        <p>
            <label>Username:</label>
            <input type="text" name="username" placeholder="username..." />
        </p>
        <p>
            <label>Password:</label>
            <input type="password" name="password" placeholder="password..." style="padding-right: 5px;" />
        </p>
        <p>
            <label><input type="checkbox" name="remember" value="remember" /> Remember me</label>
        </p>
        <p class="tombol">
            <input type="submit" name="tombol" value="Login" class="input-tombol" />
        </p>
        </fieldset>
    </form>
    </div>
</body>
</html>
