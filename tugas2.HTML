<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUGAS DUA DIANAYUOKTAVIA</title>
</head>
<body>
    <h1>TABEL LUAS PERKEBUNAN</h1>
    <table border="1" cellpadding="10" cellspacing="0"
        <tr>
            <th colspan="2" bgcolor="#fa93e0">JENIS PERKEBUNAN</th>
            <th colspan="4" bgcolor="#fa93e0">LUAS TANAH</th>
        </tr>
        <tr>
            <td colspan="2">kopi</td>
            <td>21 hektar</td>
            <td>36 hektar</td>
            <td>45 hektar</td>
            <td>54 hektar</td>
        </tr>
        <tr>
            <td colspan="2">kelapa sawit</td>
            <td>30 hektar</td>
            <td>27 hektar</td>
            <td>31 hektar</td>
            <td>20 hektar</td>
        </tr>
        <tr>
            <th colspan="2" bgcolor="#fa93e0">total poroduksi</th>
            <th colspan="2" bgcolor="#fa93e0">besaran panen bulanan</th>
            <th colspan="2" bgcolor="#fa93e0">besaran panen tahunan</th>
        </tr>
        <tr>
            <td colspan="2">kelapa sawit</td>
            <th colspan="2">200 ton</th>
            <th colspan="2">450 ton</th>
        </tr>
    </table>
</body>
</html>
